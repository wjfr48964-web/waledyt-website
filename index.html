<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07120d">
  <meta name="description" content="WALED YT - جميع الحسابات الرسمية في مكان واحد.">
  <title>WALED YT</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: #050807;
      color: #ffffff;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .page {
      position: relative;
      min-height: 100vh;
      isolation: isolate;
      overflow: hidden;
    }

    .page::before,
    .page::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.22;
      pointer-events: none;
      z-index: -2;
    }

    .page::before {
      width: 300px;
      height: 300px;
      background: #16a34a;
      top: -100px;
      right: -100px;
    }

    .page::after {
      width: 340px;
      height: 340px;
      background: #0ea5e9;
      left: -150px;
      bottom: -100px;
    }

    .grid {
      position: absolute;
      inset: 0;
      z-index: -3;
      opacity: 0.11;
      background-image:
        linear-gradient(
          rgba(255,255,255,0.06) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,0.06) 1px,
          transparent 1px
        );
      background-size: 42px 42px;
      mask-image:
        linear-gradient(
          to bottom,
          transparent,
          black 18%,
          black 82%,
          transparent
        );
    }

    .container {
      width: min(680px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 42px;
    }

    /* TOP */

    .topbar {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin-bottom: 28px;
    }

    .top-mark {
      width: 44px;
      height: 44px;
      border-radius: 15px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.09);
      display: grid;
      place-items: center;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 34px rgba(0,0,0,0.24);
    }

    .top-mark span {
      font-size: 12px;
      font-weight: 950;
      letter-spacing: -0.3px;
    }

    /* HERO */

    .hero {
      text-align: center;
      padding: 8px 0 24px;
    }

    .avatar-wrap {
      position: relative;
      width: 122px;
      height: 122px;
      margin: 0 auto 20px;
    }

    .avatar-ring {
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      padding: 2px;
      background:
        linear-gradient(
          140deg,
          #22c55e,
          #14b8a6,
          #0ea5e9
        );
      box-shadow:
        0 0 44px rgba(34,197,94,0.18);
    }

    .avatar {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: #101512;
      border: 4px solid #06100b;
    }

    .online-dot {
      position: absolute;
      right: 1px;
      bottom: 7px;
      width: 23px;
      height: 23px;
      border-radius: 50%;
      background: #22c55e;
      border: 4px solid #06100b;
      box-shadow:
        0 0 0 5px rgba(34,197,94,0.10),
        0 0 22px rgba(34,197,94,0.65);
      animation: onlinePulse 1.8s infinite;
    }

    @keyframes onlinePulse {
      0% {
        box-shadow:
          0 0 0 0 rgba(34,197,94,0.48),
          0 0 22px rgba(34,197,94,0.65);
      }

      70% {
        box-shadow:
          0 0 0 9px rgba(34,197,94,0),
          0 0 22px rgba(34,197,94,0.65);
      }

      100% {
        box-shadow:
          0 0 0 0 rgba(34,197,94,0),
          0 0 22px rgba(34,197,94,0.65);
      }
    }

    h1 {
      font-size: clamp(32px, 7vw, 50px);
      line-height: 1;
      font-weight: 950;
      letter-spacing: -1.8px;
    }

    .handle {
      margin-top: 10px;
      font-size: 15px;
      color: #9aa5a0;
      direction: ltr;
    }

    /* STATS */

    .stats {
      margin: 24px auto 0;
      max-width: 420px;
      padding: 19px 20px;
      border: 1px solid rgba(255,255,255,0.08);
      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,0.065),
          rgba(255,255,255,0.028)
        );
      border-radius: 24px;
      box-shadow: 0 18px 60px rgba(0,0,0,0.28);
      backdrop-filter: blur(18px);
    }

    .stats-label {
      font-size: 13px;
      color: #8d9993;
      margin-bottom: 7px;
    }

    .count {
      font-size: clamp(32px, 8vw, 48px);
      font-weight: 950;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums;
      direction: ltr;
    }

    .count-word {
      font-size: 15px;
      color: #b5bdb9;
      margin-right: 7px;
      font-weight: 700;
    }

    .update-status {
      margin-top: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #9da8a3;
      font-size: 12px;
    }

    .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 0 rgba(34,197,94,0.55);
      animation: pulseDot 1.8s infinite;
    }

    @keyframes pulseDot {
      0% {
        box-shadow: 0 0 0 0 rgba(34,197,94,0.50);
      }

      70% {
        box-shadow: 0 0 0 9px rgba(34,197,94,0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(34,197,94,0);
      }
    }

    /* LIVE */

    .live-area {
      margin: 12px 0 18px;
    }

    .live-card {
      display: none;
      position: relative;
      align-items: center;
      gap: 14px;
      padding: 14px 15px;
      border-radius: 24px;
      background:
        linear-gradient(
          120deg,
          rgba(255,38,38,0.15),
          rgba(255,255,255,0.045)
        );
      border: 1px solid rgba(255,75,75,0.26);
      box-shadow: 0 14px 40px rgba(255,0,0,0.08);
      overflow: hidden;
    }

    .live-card.show {
      display: flex;
    }

    .live-glow {
      position: absolute;
      right: -35px;
      bottom: -45px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(255,0,0,0.15);
      filter: blur(38px);
    }

    .live-icon {
      width: 54px;
      height: 54px;
      border-radius: 17px;
      background: #0d0d0d;
      border: 1px solid rgba(255,255,255,0.10);
      display: grid;
      place-items: center;
      flex: 0 0 54px;
      position: relative;
      z-index: 1;
    }

    .live-icon img {
      width: 28px;
      height: 28px;
    }

    .live-text {
      min-width: 0;
      position: relative;
      z-index: 1;
      text-align: right;
    }

    .live-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 900;
      font-size: 16px;
      flex-wrap: wrap;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ef2b2d;
      color: #fff;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: 950;
      letter-spacing: 0.3px;
    }

    .live-badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px rgba(255,255,255,0.85);
    }

    .live-sub {
      color: #a7afab;
      font-size: 12px;
      margin-top: 5px;
    }

    .live-arrow {
      margin-inline-start: auto;
      position: relative;
      z-index: 1;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      display: grid;
      place-items: center;
      font-size: 16px;
      flex: 0 0 38px;
    }

    /* SECTION */

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 26px 4px 12px;
    }

    .section-title h2 {
      font-size: 15px;
      font-weight: 900;
      color: #e8ecea;
    }

    .section-title span {
      font-size: 11px;
      color: #77817d;
    }

    /* SOCIAL CARDS */

    .socials {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .social-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 80px;
      padding: 13px 14px;
      border-radius: 23px;
      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,0.055),
          rgba(255,255,255,0.028)
        );
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 12px 38px rgba(0,0,0,0.19);
      backdrop-filter: blur(16px);
      transition:
        transform 0.18s ease,
        border-color 0.18s ease,
        background 0.18s ease;
    }

    .social-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255,255,255,0.15);
      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,0.075),
          rgba(255,255,255,0.035)
        );
    }

    .social-card:active {
      transform: scale(0.985);
    }

    .icon-box {
      width: 54px;
      height: 54px;
      border-radius: 17px;
      display: grid;
      place-items: center;
      flex: 0 0 54px;
      border: 1px solid rgba(255,255,255,0.09);
      background: rgba(255,255,255,0.06);
    }

    .icon-box img {
      width: 29px;
      height: 29px;
      object-fit: contain;
    }

    .info {
      min-width: 0;
      text-align: right;
    }

    .platform {
      display: block;
      font-size: 15px;
      font-weight: 900;
      line-height: 1.2;
    }

    .username {
      display: block;
      font-size: 12px;
      color: #929d98;
      margin-top: 5px;
      direction: ltr;
      text-align: right;
      unicode-bidi: plaintext;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .open {
      margin-inline-start: auto;
      width: 40px;
      height: 40px;
      border-radius: 13px;
      background: rgba(255,255,255,0.065);
      display: grid;
      place-items: center;
      color: #a8b0ad;
      font-size: 18px;
      flex: 0 0 40px;
      transition:
        background 0.18s ease,
        color 0.18s ease;
    }

    .social-card:hover .open {
      background: rgba(255,255,255,0.11);
      color: #fff;
    }

    .youtube .icon-box {
      background: rgba(255,0,0,0.11);
      border-color: rgba(255,0,0,0.15);
    }

    .instagram .icon-box {
      background: rgba(225,48,108,0.10);
      border-color: rgba(225,48,108,0.14);
    }

    .tiktok .icon-box {
      background: rgba(255,255,255,0.085);
    }

    .facebook .icon-box {
      background: rgba(24,119,242,0.11);
      border-color: rgba(24,119,242,0.16);
    }

    .kick .icon-box {
      background: rgba(83,246,136,0.085);
      border-color: rgba(83,246,136,0.15);
    }

    .live-strip {
      position: absolute;
      top: 10px;
      left: 10px;
      display: none;
      padding: 4px 8px;
      border-radius: 999px;
      background: #ef2b2d;
      color: #fff;
      font-size: 10px;
      font-weight: 950;
    }

    .social-card.is-live {
      border-color: rgba(239,43,45,0.28);
      background:
        linear-gradient(
          180deg,
          rgba(239,43,45,0.09),
          rgba(255,255,255,0.028)
        );
    }

    .social-card.is-live .live-strip {
      display: block;
    }

    /* FOOTER */

    footer {
      text-align: center;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.07);
      color: #69736e;
      font-size: 11px;
      line-height: 1.8;
    }

    .brand-footer {
      font-weight: 800;
      color: #909994;
    }

    .noscript {
      margin: 20px 0;
      padding: 14px;
      border-radius: 16px;
      background: #171c1a;
      color: #cbd3cf;
      font-size: 13px;
      text-align: center;
    }

    @media (min-width: 700px) {
      .container {
        padding-top: 38px;
      }

      .social-card {
        min-height: 86px;
      }

      .icon-box {
        width: 56px;
        height: 56px;
        flex-basis: 56px;
      }

      .open {
        width: 42px;
        height: 42px;
        flex-basis: 42px;
      }

      .avatar-wrap {
        width: 132px;
        height: 132px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto !important;
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

  <script>
    (() => {

      /*
        الإعدادات الأساسية
      */

      const CONFIG = {

        /* العدد الموجود حاليًا كقيمة احتياطية */
        fallbackFollowers: 1705,

        /* التحديث كل دقيقة */
        refreshMs: 60 * 1000,

        /*
          يمكن لاحقًا إنشاء ملف data.json
