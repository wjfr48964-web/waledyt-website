<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="description"
    content="WALED YT - جميع الحسابات الرسمية في مكان واحد."
  >

  <meta name="theme-color" content="#050505">

  <title>WALED YT</title>

  <style>
    /* =========================
       RESET
    ========================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background: #050505;
      color: #ffffff;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }


    /* =========================
       PAGE
    ========================== */

    .page {
      position: relative;
      min-height: 100vh;
      isolation: isolate;
      overflow: hidden;
    }


    /* =========================
       BACKGROUND
       مبنية على صورة القناة نفسها
    ========================== */

    .ambient-bg {
      position: fixed;
      inset: -10%;
      z-index: -10;

      background-image:
        var(--avatar-bg),
        radial-gradient(
          circle at 50% 15%,
          rgba(255,255,255,0.08),
          transparent 35%
        );

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      filter: blur(42px) saturate(1.12);
      transform: scale(1.12);

      opacity: 0.34;

      animation: ambientMove 10s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes ambientMove {
      0% {
        transform:
          scale(1.12)
          translate3d(0,0,0);
      }

      100% {
        transform:
          scale(1.17)
          translate3d(0,-12px,0);
      }
    }


    .ambient-overlay {
      position: fixed;
      inset: 0;
      z-index: -9;
      pointer-events: none;

      background:
        radial-gradient(
          circle at 50% 12%,
          rgba(16,185,129,0.13),
          transparent 27%
        ),
        radial-gradient(
          circle at 20% 70%,
          rgba(14,165,233,0.08),
          transparent 27%
        ),
        linear-gradient(
          180deg,
          rgba(2,4,3,0.62),
          rgba(3,5,4,0.92) 60%,
          rgba(3,4,4,0.98)
        );
    }


    /* نقاط ضوء متحركة */

    .light {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: -8;
      filter: blur(50px);
      opacity: 0.20;
    }

    .light.one {
      width: 220px;
      height: 220px;
      top: -90px;
      right: -80px;
      background: #22c55e;

      animation: lightOne 7s ease-in-out infinite alternate;
    }

    .light.two {
      width: 250px;
      height: 250px;
      bottom: -110px;
      left: -80px;
      background: #0ea5e9;

      animation: lightTwo 9s ease-in-out infinite alternate;
    }

    @keyframes lightOne {
      0% {
        transform: translate3d(0,0,0) scale(1);
      }

      100% {
        transform: translate3d(-35px,40px,0) scale(1.14);
      }
    }

    @keyframes lightTwo {
      0% {
        transform: translate3d(0,0,0) scale(1);
      }

      100% {
        transform: translate3d(45px,-35px,0) scale(1.12);
      }
    }


    /* شبكة خفيفة جدًا */

    .grid {
      position: fixed;
      inset: 0;
      z-index: -7;
      pointer-events: none;

      opacity: 0.045;

      background-image:
        linear-gradient(
          rgba(255,255,255,0.06) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,0.06) 1px,
          transparent 1px
        );

      background-size: 42px 42px;

      mask-image:
        linear-gradient(
          to bottom,
          transparent,
          black 20%,
          black 80%,
          transparent
        );
    }


    /* =========================
       MAIN CONTAINER
    ========================== */

    .container {
      width: min(700px, calc(100% - 28px));
      margin: 0 auto;
      padding: 30px 0 45px;
    }


    /* =========================
       TOP MINI BRAND
    ========================== */

    .topbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-bottom: 15px;
    }

    .mini-brand {
      width: 43px;
      height: 43px;

      display: grid;
      place-items: center;

      border-radius: 14px;

      background:
        rgba(255,255,255,0.055);

      border:
        1px solid rgba(255,255,255,0.085);

      backdrop-filter: blur(18px);

      box-shadow:
        0 15px 35px rgba(0,0,0,0.22);
    }

    .mini-brand img {
      width: 27px;
      height: 27px;
      border-radius: 50%;
      object-fit: cover;
    }


    /* =========================
       HERO
    ========================== */

    .hero {
      text-align: center;
      padding-top: 5px;
    }


    .avatar-area {
      position: relative;
      width: 136px;
      height: 136px;
      margin: 0 auto 22px;
    }


    /* الحلقة الخارجية */

    .avatar-ring {
      position: absolute;
      inset: -7px;

      border-radius: 50%;

      background:
        conic-gradient(
          from 0deg,
          #22c55e,
          #19d47d,
          #0ea5e9,
          #22c55e
        );

      animation:
        ringRotate 2.5s linear infinite;

      filter:
        drop-shadow(
          0 0 18px rgba(34,197,94,0.22)
        );
    }


    @keyframes ringRotate {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }


    .avatar-border {
      position: absolute;
      inset: -2px;
      border-radius: 50%;

      background: #07100b;
      z-index: 1;
    }


    .avatar {
      position: absolute;
      inset: 2px;

      width: calc(100% - 4px);
      height: calc(100% - 4px);

      object-fit: cover;
      border-radius: 50%;

      z-index: 2;

      background: #111;

      border: 4px solid #08110c;

      box-shadow:
        0 20px 55px rgba(0,0,0,0.42);
    }


    /* =========================
       النقطة الخضراء السريعة
    ========================== */

    .status-dot {
      position: absolute;

      right: 2px;
      bottom: 6px;

      width: 23px;
      height: 23px;

      background: #22c55e;

      border-radius: 50%;

      border: 4px solid #07100b;

      z-index: 5;

      box-shadow:
        0 0 12px rgba(34,197,94,0.95),
        0 0 28px rgba(34,197,94,0.42);

      animation:
        dotBeat 1.05s ease-out infinite;
    }


    /* الحلقة المتحركة حول النقطة */

    .status-dot::before,
    .status-dot::after {
      content: "";

      position: absolute;
      inset: -7px;

      border-radius: 50%;

      border: 2px solid rgba(34,197,94,0.58);

      animation:
        dotRing 1.05s ease-out infinite;
    }

    .status-dot::after {
      animation-delay: 0.32s;
    }


    @keyframes dotBeat {
      0% {
        transform: scale(0.92);
      }

      42% {
        transform: scale(1.09);
      }

      100% {
        transform: scale(0.92);
      }
    }


    @keyframes dotRing {
      0% {
        transform: scale(0.45);
        opacity: 0.95;
      }

      100% {
        transform: scale(1.55);
        opacity: 0;
      }
    }


    /* =========================
       NAME
    ========================== */

    .title {
      font-size:
        clamp(36px, 9vw, 54px);

      line-height: 1;

      font-weight: 950;

      letter-spacing: -2px;

      text-shadow:
        0 12px 40px rgba(0,0,0,0.35);
    }


    .handle {
      margin-top: 11px;

      color: #9ca7a2;

      font-size: 15px;

      direction: ltr;
    }


    .description {
      width: min(560px, 100%);

      margin:
        14px auto 0;

      color: #a7b0ac;

      font-size: 14px;

      line-height: 1.8;
    }


    /* =========================
       FOLLOWER BOX
    ========================== */

    .followers-box {
      position: relative;

      width: min(470px, 100%);

      margin:
        24px auto 0;

      padding:
        21px 20px 19px;

      border-radius: 25px;

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,0.065),
          rgba(255,255,255,0.028)
        );

      border:
        1px solid rgba(255,255,255,0.09);

      backdrop-filter: blur(20px);

      box-shadow:
        0 22px 65px rgba(0,0,0,0.30);

      overflow: hidden;
    }


    .followers-box::before {
      content: "";

      position: absolute;

      width: 180px;
      height: 180px;

      top: -110px;
      left: 50%;

      transform: translateX(-50%);

      border-radius: 50%;

      background: rgba(34,197,94,0.10);

      filter: blur(28px);

      pointer-events: none;
    }


    .followers-label {
      position: relative;

      font-size: 13px;

      color: #8c9892;

      margin-bottom: 6px;
    }


    .followers-number {
      position: relative;

      direction: ltr;

      font-size:
        clamp(38px, 9vw, 53px);

      font-weight: 950;

      letter-spacing: -1px;

      font-variant-numeric:
        tabular-nums;
    }


    .followers-word {
      color: #b3bbb7;

      font-size: 14px;

      margin-right: 7px;

      font-weight: 700;
    }


    .auto-update {
      position: relative;

      display: flex;

      justify-content: center;
      align-items: center;

      gap: 8px;

      margin-top: 9px;

      color: #94a099;

      font-size: 12px;
    }


    .tiny-green {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #22c55e;

      box-shadow:
        0 0 11px rgba(34,197,94,0.85);

      animation:
        tinyBeat 1.15s ease-in-out infinite;
    }


    @keyframes tinyBeat {
      0%, 100% {
        transform: scale(0.88);
      }

      50% {
        transform: scale(1.18);
      }
    }


    /* =========================
       SECTION HEADING
    ========================== */

    .section-head {
      display: flex;

      justify-content: space-between;
      align-items: center;

      margin:
        31px 4px 14px;
    }


    .section-head h2 {
      font-size: 16px;
      font-weight: 900;
    }


    .section-head span {
      color: #6e7973;
      font-size: 11px;
    }


    /* =========================
       SOCIAL LIST
    ========================== */

    .social-list {
      display: flex;
      flex-direction: column;

      gap: 11px;
    }


    /* =========================
       CARD
    ========================== */

    .social-card {
      position: relative;

      display: flex;
      align-items: center;

      min-height: 83px;

      padding:
        13px 14px;

      border-radius: 24px;

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,0.060),
          rgba(255,255,255,0.027)
        );

      border:
        1px solid rgba(255,255,255,0.085);

      backdrop-filter:
        blur(18px);

      box-shadow:
        0 13px 45px rgba(0,0,0,0.20);

      overflow: hidden;

      cursor: pointer;

      transition:
        transform 0.22s cubic-bezier(.2,.8,.2,1),
        border-color 0.22s ease,
        background 0.22s ease,
        box-shadow 0.22s ease;
    }


    /* ضوء يمر على البطاقة */

    .social-card::before {
      content: "";

      position: absolute;

      top: 0;
      bottom: 0;

      right: -130px;

      width: 100px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,0.08),
          transparent
        );

      transform:
        skewX(-16deg);

      opacity: 0;

      transition:
        right 0.7s ease,
        opacity 0.2s ease;

      pointer-events: none;
    }


    .social-card:hover::before {
      right: calc(100% + 100px);
      opacity: 1;
    }


    .social-card:hover {
      transform: translateY(-2px);

      border-color:
        rgba(255,255,255,0.16);

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,0.075),
          rgba(255,255,255,0.033)
        );

      box-shadow:
        0 18px 50px rgba(0,0,0,0.25);
    }


    /* حركة الضغط */

    .social-card.pressed {
      transform:
        scale(0.965);

      border-color:
        rgba(34,197,94,0.35);

      box-shadow:
        0 0 0 1px rgba(34,197,94,0.12),
        0 15px 40px rgba(34,197,94,0.07);
    }


    /* =========================
       RIPPLE
    ========================== */

    .ripple {
      position: absolute;

      width: 20px;
      height: 20px;

      border-radius: 50%;

      background:
        rgba(255,255,255,0.22);

      transform:
        translate(-50%, -50%)
        scale(0);

      pointer-events: none;

      animation:
        rippleAnimation 0.55s ease-out forwards;
    }


    @keyframes rippleAnimation {
      to {
        transform:
          translate(-50%, -50%)
          scale(16);

        opacity: 0;
      }
    }


    /* =========================
       PLATFORM ICON
    ========================== */

    .platform-icon {
      width: 55px;
      height: 55px;

      flex:
        0 0 55px;

      display: grid;
      place-items: center;

      border-radius: 17px;

      background:
        rgba(255,255,255,0.06);

      border:
        1px solid rgba(255,255,255,0.09);

      transition:
        transform 0.22s ease;
    }


    .platform-icon img {
      width: 29px;
      height: 29px;

      object-fit: contain;
    }


    .social-card:hover
    .platform-icon {
      transform:
        scale(1.07)
        rotate(-2deg);
    }


    /* =========================
       INFO
    ========================== */

    .social-info {
      min-width: 0;

      text-align: right;

      margin-right: 13px;
    }


    .platform-name {
      display: block;

      font-size: 15px;

      font-weight: 900;

      line-height: 1.2;
    }


    .platform-user {
      display: block;

      margin-top: 5px;

      color: #919c96;

      font-size: 12px;

      direction: ltr;
      text-align: right;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    /* =========================
       ARROW
    ========================== */

    .card-arrow {
      margin-inline-start: auto;

      width: 41px;
      height: 41px;

      flex:
        0 0 41px;

      display: grid;
      place-items: center;

      border-radius: 13px;

      background:
        rgba(255,255,255,0.055);

      border:
        1px solid rgba(255,255,255,0.05);

      color: #aeb8b3;

      font-size: 18px;

      transition:
        transform 0.22s ease,
        background 0.22s ease,
        color 0.22s ease;
    }


    .social-card:hover
    .card-arrow {
      transform:
        translateX(-3px);

      background:
        rgba(255,255,255,0.10);

      color: #ffffff;
    }


    /* =========================
       PLATFORM CUSTOM GLOWS
    ========================== */

    .youtube .platform-icon {
      background:
        rgba(255,0,0,0.10);
    }

    .instagram .platform-icon {
      background:
        rgba(225,48,108,0.10);
    }

    .tiktok .platform-icon {
      background:
        rgba(255,255,255,0.075);
    }

    .facebook .platform-icon {
      background:
        rgba(24,119,242,0.11);
    }

    .kick .platform-icon {
      background:
        rgba(83,246,136,0.09);
    }

    .discord .platform-icon {
      background:
        rgba(88,101,242,0.12);
    }


    /* =========================
       LIVE KICK
    ========================== */

    .kick-live-badge {
      position: absolute;

      top: 10px;
      left: 10px;

      display: none;

      align-items: center;

      gap: 6px;

      padding:
        4px 8px;

      border-radius: 999px;

      background: #ef2b2d;

      color: white;

      font-size: 10px;

      font-weight: 950;

      box-shadow:
        0 0 16px rgba(239,43,45,0.23);
    }


    .kick-live-badge::before {
      content: "";

      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: #ffffff;

      animation:
        liveSmall 0.85s ease-in-out infinite;
    }


    @keyframes liveSmall {
      0%, 100% {
        transform: scale(0.75);
      }

      50% {
        transform: scale(1.2);
      }
    }


    .kick.is-live {
      border-color:
        rgba(239,43,45,0.30);

      background:
        linear-gradient(
          180deg,
          rgba(239,43,45,0.08),
          rgba(255,255,255,0.027)
        );
    }


    .kick.is-live
    .kick-live-badge {
      display: flex;
    }


    /* =========================
       LIVE TOP CARD
    ========================== */

    .live-card {
      display: none;

      position: relative;

      align-items: center;

      gap: 13px;

      min-height: 82px;

      padding:
        13px 14px;

      margin-bottom: 13px;

      border-radius: 24px;

      background:
        linear-gradient(
          90deg,
          rgba(239,43,45,0.13),
          rgba(255,255,255,0.035)
        );

      border:
        1px solid rgba(239,43,45,0.24);

      box-shadow:
        0 18px 50px rgba(239,43,45,0.08);

      overflow: hidden;

      transition:
        transform 0.2s ease;
    }


    .live-card.show {
      display: flex;

      animation:
        liveCardIn 0.45s cubic-bezier(.2,.8,.2,1);
    }


    @keyframes liveCardIn {
      from {
        opacity: 0;
        transform:
          translateY(-12px)
          scale(0.98);
      }

      to {
        opacity: 1;
        transform:
          translateY(0)
          scale(1);
      }
    }


    .live-card:hover {
      transform:
        translateY(-2px);
    }


    .live-card .platform-icon {
      flex:
        0 0 55px;
    }


    .live-content {
      min-width: 0;
    }


    .live-title {
      display: flex;

      align-items: center;

      gap: 8px;

      flex-wrap: wrap;

      font-weight: 900;

      font-size: 14px;
    }


    .live-badge {
      display: inline-flex;

      align-items: center;

      gap: 6px;

      padding:
        5px 9px;

      border-radius: 999px;

      background: #ef2b2d;

      font-size: 10px;

      font-weight: 950;
    }


    .live-badge::before {
      content: "";

      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: white;
    }


    .live-description {
      margin-top: 5px;

      font-size: 11px;

      color: #a2aaa6;
    }


    /* =========================
       FOOTER
    ========================== */

    .footer {
      margin-top: 31px;

      padding-top: 20px;

      border-top:
        1px solid rgba(255,255,255,0.07);

      text-align: center;

      color: #707a75;

      font-size: 11px;

      line-height: 1.8;
    }


    .footer strong {
      color: #9aa49f;
    }


    /* =========================
       RESPONSIVE
    ========================== */

    @media (min-width: 700px) {

      .container {
        padding-top: 40px;
      }

      .avatar-area {
        width: 146px;
        height: 146px;
      }

      .social-card {
        min-height: 87px;
      }

      .platform-icon {
        width: 57px;
        height: 57px;

        flex-basis: 57px;
      }

    }


    /* =========================
       REDUCE MOTION
    ========================== */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

    }

  </style>
</head>


<body>

  <div class="page">

    <!-- الخلفية مأخوذة من صورة القناة -->
    <div
      class="ambient-bg"
      id="a
