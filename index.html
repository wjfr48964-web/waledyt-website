<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#050505" />
  <meta name="description" content="WALED YT - جميع روابط وحسابات وليد" />
  <title>WALED YT</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        "Cairo",
        "Tajawal",
        "Segoe UI",
        Arial,
        sans-serif;
      background:
        radial-gradient(circle at 50% 0%, rgba(24, 255, 145, 0.08), transparent 30%),
        radial-gradient(circle at 0% 80%, rgba(0, 255, 128, 0.045), transparent 28%),
        #050505;
      color: #fff;
      overflow-x: hidden;
    }

    button,
    a {
      font: inherit;
    }

    /* ---------------------------
       الخلفية
    ---------------------------- */

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .background::before {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      left: 50%;
      top: -180px;
      transform: translateX(-50%);
      background: rgba(0, 255, 132, 0.11);
      filter: blur(120px);
      border-radius: 50%;
    }

    .background::after {
      content: "";
      position: absolute;
      width: 330px;
      height: 330px;
      right: -100px;
      bottom: 10%;
      background: rgba(0, 220, 110, 0.06);
      filter: blur(110px);
      border-radius: 50%;
    }

    .glow-one,
    .glow-two {
      position: absolute;
      border-radius: 50%;
      filter: blur(110px);
      opacity: 0.45;
    }

    .glow-one {
      width: 220px;
      height: 220px;
      left: -100px;
      top: 35%;
      background: rgba(0, 255, 140, 0.05);
    }

    .glow-two {
      width: 260px;
      height: 260px;
      right: -120px;
      top: 55%;
      background: rgba(0, 255, 140, 0.045);
    }

    /* ---------------------------
       الحاوية
    ---------------------------- */

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      padding: 55px 18px 45px;
    }

    /* ---------------------------
       الرأس / الصورة
    ---------------------------- */

    .profile {
      text-align: center;
      margin-bottom: 30px;
    }

    .avatar-wrap {
      position: relative;
      width: 116px;
      height: 116px;
      margin: 0 auto 18px;
    }

    .avatar-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        #00ff88,
        rgba(0, 255, 136, 0.12),
        #00ff88,
        rgba(0, 255, 136, 0.12),
        #00ff88
      );
      animation: rotateRing 7s linear infinite;
      filter: drop-shadow(0 0 12px rgba(0, 255, 136, 0.35));
    }

    .avatar-inner {
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: #0a0a0a;
      padding: 4px;
      z-index: 2;
    }

    .avatar {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 50%;
      object-fit: cover;
      background: linear-gradient(145deg, #101010, #080808);
    }

    .avatar-wrap::after {
      content: "";
      position: absolute;
      width: 17px;
      height: 17px;
      right: 2px;
      bottom: 8px;
      border: 3px solid #050505;
      border-radius: 50%;
      background: #00f286;
      box-shadow:
        0 0 0 4px rgba(0, 242, 134, 0.08),
        0 0 16px rgba(0, 242, 134, 0.65);
      z-index: 4;
      animation: onlinePulse 2s ease-in-out infinite;
    }

    @keyframes rotateRing {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes onlinePulse {
      0%, 100% {
        box-shadow:
          0 0 0 4px rgba(0, 242, 134, 0.08),
          0 0 16px rgba(0, 242, 134, 0.55);
      }

      50% {
        box-shadow:
          0 0 0 7px rgba(0, 242, 134, 0.03),
          0 0 24px rgba(0, 242, 134, 0.9);
      }
    }

    .title {
      margin: 0;
      font-size: 31px;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: #fff;
    }

    .username {
      margin: 4px 0 0;
      font-size: 15px;
      font-weight: 600;
      color: #8f8f8f;
      direction: ltr;
    }

    .bio {
      max-width: 430px;
      margin: 12px auto 0;
      color: #bcbcbc;
      line-height: 1.8;
      font-size: 14px;
    }

    /* ---------------------------
       إجمالي المتابعين
    ---------------------------- */

    .followers-box {
      position: relative;
      margin: 26px auto 14px;
      padding: 18px 20px;
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.045),
          rgba(255, 255, 255, 0.018)
        );
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.04),
        0 18px 50px rgba(0, 0, 0, 0.22);
      overflow: hidden;
    }

    .followers-box::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          120deg,
          transparent 20%,
          rgba(0, 255, 136, 0.05),
          transparent 70%
        );
      transform: translateX(100%);
      animation: boxShine 6s ease-in-out infinite;
    }

    @keyframes boxShine {
      0%, 65%, 100% {
        transform: translateX(100%);
      }

      82% {
        transform: translateX(-100%);
      }
    }

    .followers-label {
      position: relative;
      color: #8e8e8e;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .followers-number {
      position: relative;
      font-size: 30px;
      font-weight: 900;
      direction: ltr;
      letter-spacing: 1px;
    }

    .auto-status {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 9px;
      color: #8f8f8f;
      font-size: 12px;
    }

    .auto-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00ee83;
      box-shadow: 0 0 12px rgba(0, 238, 131, 0.65);
    }

    /* ---------------------------
       الروابط
    ---------------------------- */

    .links {
      display: flex;
      flex-direction: column;
      gap: 13px;
      margin-top: 22px;
    }

    .link-card {
      --mx: 50%;
      --my: 50%;

      position: relative;
      display: flex;
      align-items: center;
      min-height: 78px;
      padding: 13px 16px;
      border: 1px solid rgba(255, 255, 255, 0.085);
      border-radius: 22px;
      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.065),
          rgba(255, 255, 255, 0.026)
        );
      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.035);
      text-decoration: none;
      color: white;
      overflow: hidden;
      isolation: isolate;
      transform: translateZ(0);
      transition:
        transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1),
        border-color 0.22s ease,
        box-shadow 0.22s ease,
        background 0.22s ease;
    }

    /* الإضاءة التي تتبع مكان اللمس */
    .link-card::before {
      content: "";
      position: absolute;
      left: var(--mx);
      top: var(--my);
      width: 150px;
      height: 150px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(0, 255, 136, 0.13) 0%,
        rgba(0, 255, 136, 0.055) 35%,
        transparent 72%
      );
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
      z-index: -1;
    }

    /* لمعة تمر عبر البطاقة */
    .link-card::after {
      content: "";
      position: absolute;
      top: -40%;
      left: -70%;
      width: 45%;
      height: 180%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.12),
        transparent
      );
      transform: rotate(16deg);
      opacity: 0;
      pointer-events: none;
      z-index: 3;
    }

    .link-card:hover {
      transform: translateY(-3px) scale(1.012);
      border-color: rgba(0, 255, 136, 0.24);
      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.30),
        0 0 0 1px rgba(0, 255, 136, 0.04),
        0 0 25px rgba(0, 255, 136, 0.055);
    }

    .link-card:hover::before {
      opacity: 1;
    }

    .link-card:hover::after {
      animation: shineSweep 0.75s ease forwards;
    }

    @keyframes shineSweep {
      0% {
        left: -70%;
        opacity: 0;
      }

      15% {
        opacity: 1;
      }

      100% {
        left: 145%;
        opacity: 0;
      }
    }

    /* الضغط */
    .link-card.pressed {
      transform: scale(0.945);
      border-color: rgba(0, 255, 136, 0.62);
      background:
        linear-gradient(
          135deg,
          rgba(0, 255, 136, 0.115),
          rgba(255, 255, 255, 0.035)
        );
      box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.38),
        0 0 0 1px rgba(0, 255, 136, 0.17),
        0 0 32px rgba(0, 255, 136, 0.18);
    }

    .link-card.pressed::before {
      opacity: 1;
      width: 280px;
      height: 280px;
    }

    .link-card.pressed::after {
      animation: pressFlash 0.55s ease forwards;
    }

    @keyframes pressFlash {
      0% {
        left: -75%;
        opacity: 0;
      }

      15% {
        opacity: 1;
      }

      100% {
        left: 155%;
        opacity: 0;
      }
    }

    /* ---------------------------
       الأيقونة
    ---------------------------- */

    .icon-box {
      flex: 0 0 50px;
      width: 50px;
      height: 50px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(255, 255, 255, 0.065);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.04),
        0 7px 20px rgba(0, 0, 0, 0.14);
      transition:
        transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1),
        background 0.25s ease,
        box-shadow 0.25s ease;
      overflow: hidden;
    }

    .icon-box img {
      width: 29px;
      height: 29px;
      object-fit: contain;
      display: block;
    }

    .link-card:hover .icon-box {
      transform: scale(1.08) rotate(-2deg);
      background: rgba(255, 255, 255, 0.08);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.05),
        0 0 20px rgba(0, 255, 136, 0.08);
    }

    .link-card.pressed .icon-box {
      transform: scale(0.88) rotate(3deg);
    }

    /* ---------------------------
       النص
    ---------------------------- */

    .link-content {
      min-width: 0;
      flex: 1;
      padding: 0 14px;
    }

    .link-title {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.35;
    }

    .link-subtitle {
      margin: 4px 0 0;
      color: #888;
      font-size: 12px;
      line-height: 1.4;
      direction: ltr;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---------------------------
       السهم
    ---------------------------- */

    .arrow {
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      color: #888;
      background: rgba(255, 255, 255, 0.035);
      transition:
        transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1),
        color 0.2s ease,
        background 0.2s ease;
    }

    .arrow svg {
      width: 17px;
      height: 17px;
      transition: transform 0.25s ease;
    }

    .link-card:hover .arrow {
      color: #fff;
      background: rgba(0, 255, 136, 0.08);
      transform: translateX(-3px);
    }

    .link-card:hover .arrow svg {
      transform: translateX(-2px);
    }

    .link-card.pressed .arrow {
      color: #00ff88;
      transform: scale(0.9);
    }

    /* ---------------------------
       Ripple
    ---------------------------- */

    .ripple {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.34);
      transform: translate(-50%, -50%) scale(0);
      animation: rippleEffect 0.65s cubic-bezier(0.15, 0.75, 0.25, 1) forwards;
      z-index: 5;
    }

    @keyframes rippleEffect {
      0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0.65;
      }

      60% {
        opacity: 0.2;
      }

      100% {
        transform: translate(-50%, -50%) scale(24);
        opacity: 0;
      }
    }

    /* ---------------------------
       الفوتر
    ---------------------------- */

    .footer {
      text-align: center;
      margin-top: 28px;
      padding-top: 8px;
      color: #676767;
      font-size: 12px;
    }

    .footer strong {
      color: #989898;
      font-weight: 800;
    }

    /* ---------------------------
       انتقال الصفحة
    ---------------------------- */

    .page-transition {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(3, 3, 3, 0.56);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      visibility: hidden;
      transition:
        opacity 0.22s ease,
        visibility 0.22s ease;
      z-index: 9999;
      pointer-events: none;
    }

    .page-transition.active {
      opacity: 1;
      visibility: visible;
    }

    .transition-ring {
      position: relative;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 2px solid rgba(0, 255, 136, 0.13);
    }

    .transition-ring::before {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #00ff88;
      border-right-color: rgba(0, 255, 136, 0.35);
      animation: transitionSpin 0.7s linear infinite;
    }

    .transition-ring::after {
      content: "W";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 19px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 18px rgba(0, 255, 136, 0.45);
    }

    @keyframes transitionSpin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ---------------------------
       دخول العناصر
    ---------------------------- */

    .profile,
    .followers-box,
    .link-card {
      animation: pageEnter 0.65s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .followers-box {
      animation-delay: 0.08s;
    }

    .link-card:nth-child(1) {
      animation-delay: 0.13s;
    }

    .link-card:nth-child(2) {
      animation-delay: 0.18s;
    }

    .link-card:nth-child(3) {
      animation-delay: 0.23s;
    }

    .link-card:nth-child(4) {
      animation-delay: 0.28s;
    }

    .link-card:nth-child(5) {
      animation-delay: 0.33s;
    }

    .link-card:nth-child(6) {
      animation-delay: 0.38s;
    }

    @keyframes pageEnter {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ---------------------------
       الهاتف
    ---------------------------- */

    @media (max-width: 480px) {
      .page {
        padding: 38px 14px 32px;
      }

      .avatar-wrap {
        width: 105px;
        height: 105px;
      }

      .title {
        font-size: 28px;
      }

      .followers-box {
        padding: 16px;
        border-radius: 20px;
      }

      .followers-number {
        font-size: 27px;
      }

      .link-card {
        min-height: 74px;
        border-radius: 20px;
        padding: 12px 13px;
      }

      .icon-box {
        width: 47px;
        height: 47px;
        flex-basis: 47px;
        border-radius: 15px;
      }

      .icon-box img {
        width: 27px;
        height: 27px;
      }

      .link-content {
        padding: 0 11px;
      }

      .link-title {
        font-size: 15px;
      }

      .arrow {
        width: 31px;
        height: 31px;
        flex-basis: 31px;
      }
    }

    /* تقليل الحركات عند طلب النظام ذلك */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
